<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <!-- Фон до загрузки CSS-бандла: без него при загрузке мелькает белое. Цвета = --canvas из src/global.css -->
    <style>
      html {
        background: #f9f9f9;
      }
      html.dark {
        background: #16191c;
      }
    </style>
    <!-- Класс темы до первой отрисовки, а не после монтирования React (next-themes, ключ localStorage 'theme') -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        var dark =
          theme === 'dark' ||
          ((!theme || theme === 'system') &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
